name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp service worker cache versions
        run: find . -path ./.git -prune -o -name 'service-worker.js' -print0 | xargs -0 sed -i "s/@@CACHE_STAMP@@/${GITHUB_SHA::7}/g"
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Allow Pages artifact metadata to settle
        run: sleep 5
      - id: deployment
        uses: actions/deploy-pages@v4
