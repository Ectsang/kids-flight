<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#87CEEB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sky Pilot</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- START SCREEN -->
  <div class="screen active" id="startScreen">
    <div class="start-content">
      <h1 class="start-title">Sky Pilot</h1>
      <div class="start-plane">✈️</div>
      <p class="start-hint">Tap to fly!</p>
      <div class="vehicle-picker" id="vehiclePicker"></div>
      <div class="difficulty-picker" id="difficultyPicker">
        <button class="diff-btn selected" data-diff="easy">
          <span class="diff-hearts">❤️❤️❤️❤️❤️</span>
          <span class="diff-label">Easy</span>
        </button>
        <button class="diff-btn" data-diff="medium">
          <span class="diff-hearts">❤️❤️❤️</span>
          <span class="diff-label">Medium</span>
        </button>
        <button class="diff-btn" data-diff="hard">
          <span class="diff-hearts">❤️❤️</span>
          <span class="diff-label">Hard</span>
        </button>
      </div>
      <button class="start-btn" id="startBtn">Start Flying!</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="gameScreen">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <div class="hud-item" id="hudHP">❤️❤️❤️❤️❤️</div>
      <div class="hud-item" id="hudStars">⭐ 0</div>
      <div class="hud-item" id="hudDistance">📏 0m</div>
    </div>
    <button class="pause-btn" id="pauseBtn">⏸️</button>
  </div>

  <!-- PAUSE OVERLAY -->
  <div class="overlay" id="pauseOverlay">
    <div class="overlay-content">
      <h2>Paused</h2>
      <button class="overlay-btn" id="resumeBtn">▶️ Keep Flying!</button>
      <button class="overlay-btn secondary" id="homeBtn">🏠 Home</button>
    </div>
  </div>

  <!-- GAME OVER OVERLAY -->
  <div class="overlay" id="gameOverOverlay">
    <div class="overlay-content">
      <h2 id="gameOverTitle">Great Flight!</h2>
      <div class="game-over-stats">
        <p class="go-stat">⭐ <span id="goStars">0</span> stars</p>
        <p class="go-stat">📏 <span id="goDistance">0</span>m flown</p>
      </div>
      <button class="overlay-btn" id="retryBtn">🔄 Fly Again!</button>
      <button class="overlay-btn secondary" id="goHomeBtn">🏠 Home</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
